# Phase 1.5 generator controls; all random streams derive from project.seed.
generator:
  shop_daily_shock:
    # Mean-one lognormal sigma; 0 disables correlated daily demand.
    sigma: 0.07
    # Dedicated shop-shock random stream, independent of scheduling/items/weather.
    random_stream: 10
  promotions:
    # per_item promotes independently; shop_day keeps one selected peer per shop day.
    mode: per_item
    # Probability per item/day, approximately 65 promotions/item over three years.
    per_item_probability: 0.06
    # Stable promotion RNG namespace.
    random_stream: 11
    # Fixed spillover/selection universe: adding menu items does not alter existing history.
    peer_item_ids: [espresso, americano, latte, cappuccino, cold_coffee, iced_latte, hot_chocolate, masala_chai, croissant, sandwich]
  drift:
    # null resolves to validation start; override with an ISO date to move the ramp.
    start_date: null
  record_status:
    # Optionally expose censored stockout rows for later treatment; all other defects stay excluded.
    allow_stockout_for_training: false
  # Stable per-item demand and observation RNG namespace, combined with SHA-256(item_id).
  item_random_stream: 12
sqlite:
  # Optional override applies to both database basenames; no project files are moved.
  directory_env_variable: COFFEE_DB_DIR
  # Staging disables this internally so temporary databases never resolve to live paths.
  honor_environment_override: true
  # DELETE permits attached-database atomic commits; WAL is intentionally not enabled.
  journal_mode: DELETE
  # Example for the required OneDrive warning; this is a recommendation, not a move target.
  non_synced_example: C:/dev/coffee-inventory-ml
leakage_guard:
  # Add future training/feature folders here; absolute paths are supported for tests.
  protected_folders: [src/features, src/models]
  # Conservative source-text guard: comments and strings count as references.
  blocked_symbols: [truth_loader, load_truth, simulation_truth, truth_database, latent_demand, expected_demand_without_shop_shock, shop_daily_multiplier]
quality:
  # Clean-data hot/normal comparison uses this Celsius cutoff.
  hot_temperature_threshold: 30
  # Items for clean hot-vs-normal demand comparisons.
  cold_items: [cold_coffee, iced_latte]
  # Items for clean rainy-vs-dry demand comparisons.
  rain_items: [hot_chocolate, masala_chai]
cli:
  # Maximum execution time per notebook cell in the existing venv.
  notebook_timeout_seconds: 120
  # Required-library import checks for setup-check; installed versions remain pinned.
  setup_check_imports: [numpy, pandas, sklearn, lightgbm, statsmodels.api, shap, matplotlib.pyplot, plotly, fastapi, uvicorn, streamlit, sqlalchemy, yaml, joblib, holidays, httpx, nbformat]

# Training-only exploratory plots; held-out data does not guide model choices.
eda:
  split: train
  # Descriptive smoothing window, not a model input.
  trend_window: 28
  # Plot dimensions in inches and output resolution.
  figure_size: [10, 4]
  dpi: 120
  # Stable filenames under paths.figures.
  figures: {weekly: eda_weekly.png, festival: eda_festival.png, weather: eda_weather.png, trend: eda_trend.png, stockouts: eda_stockouts.png}

# Phase 3 plot filenames under paths.figures.
model_figures:
  comparison: model_wape.png
  intervals: model_intervals.png
  shap: shap_summary.png

# Frozen Phase 5 replay choices; no tuning on test outcomes.
simulation_settings:
  # Weekly forecast refresh, daily inventory review; fixed-origin predictions in between.
  forecast_refresh_days: 7
  # Manual estimate uses valid observations in the previous seven calendar days.
  manual_window_days: 7
  # Past seasonal-naive error window used for material residual sigma.
  residual_window_days: 28
  # Cache requires matching source/model/config fingerprint and file hash.
  reuse_forecast_cache: true
simulation_figures:
  comparison: simulation_comparison.png
  costs: simulation_costs.png
