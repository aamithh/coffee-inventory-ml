project:
  name: coffee-inventory-ml
  seed: 42
  # null computes the first held-out test date; use an ISO date to override.
  as_of_date: null
  # Number of days to forecast; calendar coverage includes as_of_date plus this horizon.
  forecast_horizon_days: 7
  currency: INR
  timezone: Asia/Kolkata
paths:
  raw: data/raw
  processed: data/processed
  external: data/external
  database: data/processed/coffee.sqlite
  # Evaluation-only demand is isolated from the observed-sales database.
  truth_database: data/processed/simulation_truth.db
  # Isolated generated artifacts are validated here before publication.
  pipeline_staging: data/processed/.pipeline_staging
  # Preserve the original Phase 1 dataset before this patch.
  backup_pre_1_5: data/processed/backup_pre_1_5
  # Full command output and measured Phase 1.5 checks.
  verification_output: reports/phase_1_5_verification.txt
  models: models
  figures: reports/figures
  # Separate Phase 2 output paths; existing generated sales and databases remain untouched.
  features_csv: data/processed/features.csv
  feature_manifest: data/processed/feature_manifest.json
  eda_summary: reports/eda_summary.json
  eda_report: reports/eda.md
  phase_2_verification: reports/phase_2_verification.txt
  # Phase 3 artifacts and measured model reports.
  model_bundle: models/forecast_bundle.joblib
  model_metadata: models/metadata.json
  model_report: reports/modeling.md
  model_metrics_csv: reports/model_metrics.csv
  model_predictions: reports/test_predictions.csv
  model_cv_results: reports/walk_forward.csv
  model_recursive_metrics: reports/recursive_metrics.csv
  demo_forecast: reports/demo_forecast.csv
  model_explanation: reports/prediction_explanation.json
  phase_3_verification: reports/phase_3_verification.txt
  # Phase 4 outputs are separate from source data and model artifacts.
  inventory_bom: reports/inventory_bom.csv
  inventory_forecasts: reports/inventory_forecasts.csv
  material_requirements: reports/material_requirements.csv
  inventory_snapshot: reports/inventory_snapshot.csv
  inventory_orders: reports/inventory_orders.csv
  inventory_summary: reports/inventory_summary.json
  inventory_report: reports/inventory.md
  phase_4_verification: reports/phase_4_verification.txt
  # Executed notebook path used by verification.
  modeling_notebook: notebooks/02_modeling.ipynb
  metrics: reports/metrics.json
  simulation: reports/simulation.csv
  # Phase 5 replay outputs; source sales, features and models are immutable.
  simulation_items: reports/simulation_items.csv
  simulation_orders: reports/simulation_orders.csv
  simulation_summary: reports/simulation_summary.csv
  simulation_waste: reports/simulation_waste.csv
  simulation_forecasts: reports/simulation_forecasts.csv
  simulation_metadata: reports/simulation_metadata.json
  simulation_metrics: reports/simulation_metrics.json
  simulation_report: reports/simulation.md
  simulation_notebook: notebooks/03_simulation.ipynb
  phase_5_verification: reports/phase_5_verification.txt
  # Local API inventory revisions are separate from generated source datasets.
  api_inventory_state: data/processed/api_inventory.json
  phase_6_verification: reports/phase_6_verification.txt
  api_schema: reports/api_openapi.json
  phase_7_verification: reports/phase_7_verification.txt
  dashboard_screenshots: reports/dashboard_screenshots
  # Local visual theme; no remote assets are required.
  dashboard_styles: src/dashboard/theme.css
  # Keep redesign verification and captures separate from earlier phase evidence.
  dashboard_redesign_verification: reports/dashboard_redesign_verification.txt
  dashboard_redesign_desktop: reports/dashboard_screenshots/redesign_desktop.jpg
  dashboard_redesign_mobile: reports/dashboard_screenshots/redesign_mobile.jpg
  # Final quality transcript and presentation documents.
  phase_8_verification: reports/phase_8_verification.txt
  final_report: docs/report.md
  slide_outline: docs/slide_outline.md
  demo_script: docs/demo_script.md
  sales_csv: data/raw/sales.csv
  truth_csv: data/raw/simulation_truth.csv
  calendar_csv: data/external/calendar.csv
  weather_cache: data/external/weather.csv
  weather_metadata: data/external/weather_metadata.json
  data_summary: reports/data_summary.json
  sales_sample: reports/sales_sample.csv
  data_dictionary: docs/data_dictionary.md
  data_dictionary_json: docs/data_dictionary.json
  data_report: reports/data_quality.md
data:
  start_date: '2023-01-01'
  end_date: '2025-12-31'
  weather_provider: auto
  latitude: 12.9716
  longitude: 77.5946
  promotion_probability: 0.08
  promotion_lift: 1.25
  cannibalization_factor: 0.97
  stockout_probability: 0.025
  missing_probability: 0.005
  outlier_probability: 0.005
  closure_probability: 0.008
  annual_trend: 0.06
  drift_duration_days: 180
  drift_lift: 0.12
  noise_dispersion: 30
  weekend_lift: 1.15
  cold_bakery_weekend_lift: 1.3
  payday_lift: 1.08
  festival_pre_lift: 1.2
  festival_day_factor: 0.85
  weather_timeout_seconds: 30
  random_stream: 1
  weekday_factors:
  - 0.95
  - 0.97
  - 1
  - 1
  - 1.08
  - 1
  - 1
  high_weekend_categories:
  - cold_drink
  - bakery
  promotion_discount: 0.1
  stockout_cap_min: 0.35
  stockout_cap_max: 0.75
  outlier_multiplier_min: 2.5
  outlier_multiplier_max: 4.5
  festival_pre_days: 2
  other_holiday_factor: 0.95
  long_weekend_lift: 1.1
  sample_rows: 20
features:
  lags:
  - 1
  - 7
  - 14
  - 28
  rolling_windows:
  - 7
  - 28
  censored_target_policy: exclude
  # Weather inputs available before target date: persistence or timestamped supplied forecasts.
  weather_policy: persistence
  # Prior clean observations used to estimate censored targets, without backward filling.
  imputation_window: 7
  # Fixed calendar periods; encodings do not fit statistics on future data.
  cyclical_periods: {day_of_week: 7, month: 12, day_of_month: 31, week_of_year: 53}
  cold_start_days: 14
  temperature_bins:
  - 20
  - 28
  - 35
validation:
  train_fraction: 0.7
  validation_fraction: 0.15
  test_fraction: 0.15
  walk_forward_folds: 5
models:
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  ridge_alpha: 1.0
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    verbosity: -1
    n_jobs: 2
  tuning:
    num_leaves:
    - 15
    - 31
    learning_rate:
    - 0.03
    - 0.05
  # Missing baseline lags use only prior observed item/category estimates.
  baseline_fallback_columns: [sales_rolling_mean_7, category_past_mean]
  # Requested relative WAPE improvement; measured, never imposed on results.
  required_wape_improvement: 0.15
  # Seven-day recursive evaluation origins advance by seven days.
  recursive_origin_stride: 7
  # Deterministic sample for SHAP plots; explanations remain additive model associations.
  shap_sample_rows: 200
  # Maximum SHAP summary drivers and progress cadence for recursive evaluation.
  shap_max_display: 15
  recursive_progress_every: 4
  explanation_top_n: 5
  # Validation chooses between these ML point models before test evaluation.
  point_candidates: [ridge, lightgbm]
  # If enabled, the optional SARIMAX extension requires separate implementation.
  enable_sarimax: false
inventory:
  # Mean need and spread estimated over this initial forecast window.
  mean_window_days: 7
  # Floating point tolerance in supplier pack ceil/floor calculations.
  rounding_tolerance: 1.0e-9
  # Normal approximation; the target is not an empirical service guarantee.
  service_level: 0.95
  # Leave this many days before material expiry.
  buffer_days: 1
  # Coverage begins at receipt, in addition to supplier lead time.
  target_coverage_days: 7
  manual_buffer_fraction: 0.2
  holding_cost_daily_fraction: 0.001
  lost_sale_penalty_fraction: 1.0
  initial_coverage_days: 3
api:
  # Local development only; one process owns snapshot revisions.
  workers: 1
  log_level: info
  # Synthetic what-if weather vintage precedes the configured forecast origin.
  scenario_issue_lead_minutes: 1
  scenario_festival_name: scenario
  # Bounds for verification's temporary live loopback server.
  verification_startup_seconds: 30
  verification_request_seconds: 60
  verification_poll_seconds: 0.2
  verification_shutdown_seconds: 10
  host: 127.0.0.1
  port: 8000
  max_forecast_days: 30
dashboard:
  host: 127.0.0.1
  port: 8501
  # local embeds the service; http shares the separately running API revision store.
  backend: local
  api_url: http://127.0.0.1:8000
  request_timeout_seconds: 60
  # Config override for app tests and standalone Streamlit runs.
  config_environment_variable: COFFEE_DASHBOARD_CONFIG
  theme: light
  history_days: 28
  verification_startup_seconds: 30
  verification_poll_seconds: 0.2
  verification_shutdown_seconds: 10
  app_test_timeout_seconds: 60
  colors:
    # Café palette shared by charts and local styles.
    primary: '#d96545'
    muted: '#8b7b70'
    band: 'rgba(217,101,69,0.16)'
    sidebar: '#f4eee5'
    secondary: '#248b77'
    accent: '#8570b7'
    palette: ['#d96545', '#248b77', '#8570b7', '#d5a43b']
  weather_controls:
    temperature_min: -10
    temperature_max: 45
    default_max: 32
    default_min: 22
    rainfall_max: 100
    default_rain: 0
